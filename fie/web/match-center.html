<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مركز المباريات — FIE</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/fie.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">FIE</a>
    <span class="crumb">مركز المباريات</span>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="match.html">توقع</a>
    </nav>
  </header>
  <div class="wrap">
    <h1>توقعات اليوم</h1>
    <p class="lede">احتمالات معايرة قبل الانطلاق — مع ثقة النموذج وأهم العوامل.</p>
    <div id="fixtures"></div>
    <p class="media-credit">شعارات الفرق وصور اللاعبين للعرض التجريبي عبر media.api-sports.io — يُستبدل في الإنتاج بتغذية مرخّصة.</p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/media.js"></script>
  <script>
    const root = document.getElementById("fixtures");
    const { teams, fixtures } = window.FIE_MEDIA;
    fixtures.forEach((fx) => {
      const home = teams[fx.home];
      const away = teams[fx.away];
      const a = document.createElement("a");
      a.className = "fixture";
      a.href = fx.href;
      a.innerHTML = `
        <div><time>${fx.kickoff}</time><span class="league">${fx.league}</span></div>
        <div>
          <div class="team-line"><img class="crest" src="${home.crest}" alt="${home.nameEn}" /><strong>${home.name}</strong></div>
          <div class="team-line"><img class="crest" src="${away.crest}" alt="${away.nameEn}" /><span>${away.name}</span></div>
        </div>
        <div style="display:flex;gap:1rem;font-family:var(--fie-font-display);font-weight:700">
          <span style="color:var(--fie-teal)">${fx.probs[0]}%</span>
          <span>${fx.probs[1]}%</span>
          <span>${fx.probs[2]}%</span>
        </div>
        <span class="chip">ثقة متوسطة</span>
      `;
      root.appendChild(a);
    });
  </script>
</body>
</html>
