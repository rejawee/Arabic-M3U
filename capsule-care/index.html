<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a3d4a" />
  <title>شفاء — عيادة الكبسولات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Hero / Title -->
    <section id="screen-title" class="screen active" aria-label="الشاشة الرئيسية">
      <div class="hero-bg" aria-hidden="true">
        <canvas id="hero-capsules" width="900" height="1600"></canvas>
        <div class="hero-veil"></div>
      </div>
      <header class="hero-brand">
        <p class="hero-eyebrow">عيادة الكبسولات الفاخرة</p>
        <h1 class="brand">شفاء</h1>
        <p class="hero-tagline">أنت الطبيب. الكبسولات دوائك. المرضى ينتظرون الأمل.</p>
        <div class="hero-cta">
          <button type="button" class="btn btn-primary" id="btn-start">ابدأ العيادة</button>
          <button type="button" class="btn btn-ghost" id="btn-continue" hidden>متابعة العلاج</button>
        </div>
      </header>
      <footer class="hero-foot">
        <span>بودرة متحركة · مطابقة ثلاثية · قصة طبية متكاملة</span>
      </footer>
    </section>

    <!-- Map / Clinics -->
    <section id="screen-map" class="screen" aria-label="خريطة العيادات">
      <header class="topbar">
        <button type="button" class="icon-btn" id="btn-map-home" title="الرئيسية">⌂</button>
        <div class="topbar-title">
          <h2>مسار الشفاء</h2>
          <p id="doctor-rank">طبيب مقيم</p>
        </div>
        <div class="stat-pill" id="map-stars" title="نجوم">★ 0</div>
      </header>
      <div class="map-scroll" id="map-scroll">
        <div class="map-path" id="map-path"></div>
      </div>
    </section>

    <!-- Story intro before level -->
    <section id="screen-story" class="screen" data-theme="neighborhood" aria-label="قصة المستوى">
      <canvas id="story-scene" class="story-scene-canvas" aria-hidden="true"></canvas>
      <div class="story-bg" aria-hidden="true"></div>
      <div class="story-panel">
        <div class="story-clinic" id="story-clinic">عيادة الحي</div>
        <div class="patient-card">
          <div class="patient-avatar" id="patient-avatar" aria-hidden="true"></div>
          <div class="patient-info">
            <h2 id="patient-name">مريض</h2>
            <p id="patient-condition">الحالة</p>
          </div>
        </div>
        <p class="story-text" id="story-text"></p>
        <div class="objectives" id="story-objectives"></div>
        <button type="button" class="btn btn-primary" id="btn-play-level">ادخل غرفة العلاج</button>
        <button type="button" class="btn btn-ghost" id="btn-story-back">رجوع</button>
      </div>
    </section>

    <!-- Gameplay -->
    <section id="screen-game" class="screen" data-theme="neighborhood" aria-label="لوحة اللعب">
      <canvas id="game-scene" class="game-scene-canvas" aria-hidden="true"></canvas>
      <div class="stage-bg" id="stage-bg" aria-hidden="true">
        <div class="stage-bg-glow"></div>
      </div>

      <header class="rm-hud">
        <div class="rm-hud-bar">
          <div class="rm-level-badge" id="hud-level">
            <span class="rm-level-label">مستوى</span>
            <strong id="hud-level-num">1</strong>
          </div>
          <div class="rm-goals" id="hud-goals">
            <span class="rm-goals-label">هدف العلاج</span>
            <div class="rm-goals-list" id="hud-goals-list"></div>
          </div>
          <div class="rm-patient">
            <div class="rm-portrait-ring">
              <div class="rm-portrait" id="hud-portrait">👩</div>
            </div>
            <div class="rm-patient-text">
              <strong id="hud-patient-name">سارة</strong>
              <span id="hud-condition">نزلة برد</span>
            </div>
          </div>
          <div class="rm-moves">
            <span class="rm-moves-label">حركات</span>
            <strong id="hud-moves">22</strong>
          </div>
          <button type="button" class="rm-pause" id="btn-pause" title="إيقاف">
            <span class="rm-pause-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <div class="board-stage">
        <div class="board-wrap" id="board-wrap">
          <canvas id="board" width="720" height="720"></canvas>
          <div class="board-fx" id="board-fx" aria-hidden="true"></div>
        </div>
        <div class="juice-layer" id="juice-layer" aria-hidden="true"></div>
      </div>

      <div class="rm-booster-tray">
        <footer class="boosters">
        <button type="button" class="booster" data-booster="hammer" title="مطرقة العلاج — امسح صفاً">
          <img class="booster-icon" src="assets/boosters/hammer.png" alt="مطرقة" width="44" height="44" />
          <span class="booster-label">مطرقة</span>
          <span class="booster-count" id="boost-hammer">3</span>
        </button>
        <button type="button" class="booster" data-booster="rocket" title="صاروخ الدواء — امسح عموداً">
          <img class="booster-icon" src="assets/boosters/rocket.png" alt="صاروخ" width="44" height="44" />
          <span class="booster-label">صاروخ</span>
          <span class="booster-count" id="boost-rocket">3</span>
        </button>
        <button type="button" class="booster" data-booster="bomb" title="جرعة مركّزة — انفجار 3×3">
          <img class="booster-icon" src="assets/boosters/bomb.png" alt="قنبلة" width="44" height="44" />
          <span class="booster-label">قنبلة</span>
          <span class="booster-count" id="boost-bomb">2</span>
        </button>
        <button type="button" class="booster" data-booster="mix" title="خلط الوصفة — إعادة ترتيب">
          <img class="booster-icon" src="assets/boosters/mix.png" alt="خلط" width="44" height="44" />
          <span class="booster-label">خلط</span>
          <span class="booster-count" id="boost-mix">2</span>
        </button>
        </footer>
      </div>
    </section>

    <!-- Result — LAB COMPLETE -->
    <section id="screen-result" class="screen" aria-label="نتيجة المستوى">
      <div class="lab-complete">
        <canvas id="result-hero" width="720" height="520" aria-hidden="true"></canvas>
        <div class="lab-complete-body">
          <p class="lab-eyebrow" id="result-eyebrow">LAB COMPLETE</p>
          <h2 id="result-title">أتممت مختبر الكبسولة</h2>
          <p id="result-msg"></p>
          <div class="stars" id="result-stars" aria-label="النجوم"></div>
          <div class="result-actions">
            <button type="button" class="btn btn-gold" id="btn-next">المريض التالي</button>
            <button type="button" class="btn btn-ghost" id="btn-retry">أعد التجربة</button>
            <button type="button" class="btn btn-ghost" id="btn-to-map">خريطة العيادات</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Pause overlay -->
    <div id="overlay-pause" class="overlay" hidden>
      <div class="overlay-card">
        <h3>توقف العلاج مؤقتاً</h3>
        <button type="button" class="btn btn-primary" id="btn-resume">متابعة</button>
        <button type="button" class="btn btn-ghost" id="btn-quit-level">مغادرة الغرفة</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
